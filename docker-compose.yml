name: miller

services:
  postgres:
    image: postgres:17
    container_name: miller_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - '${POSTGRES_PORT}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: miller_redis
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./src/backend
      dockerfile: ../../docker/backend/Dockerfile
      additional_contexts:
        docker: ./docker/backend
    image: miller_backend
    container_name: miller_backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DJANGO_READ_DOT_ENV_FILE: 'False'
    volumes:
      - ./src/backend:/app
    ports:
      - '${BACKEND_PORT}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./src/frontend
      dockerfile: ../../docker/frontend/Dockerfile
    image: miller_frontend
    container_name: miller_frontend
    environment:
      VITE_DEFAULT_URL: ${VITE_DEFAULT_URL}
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '${FRONTEND_PORT}:3002'
    depends_on:
      - backend

  dumper:
    build: ./docker/dumper
    image: miller_dumper
    container_name: miller_dumper
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: {}
  redis_data: {}
  frontend_node_modules: {}
