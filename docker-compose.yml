name: miller

services:
  postgres:
    image: postgres:17
    container_name: miller_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    configs:
      - source: pg_init
        target: /docker-entrypoint-initdb.d/00-init.sql
    ports:
      - '${POSTGRES_PORT}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: miller_redis
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./src/backend
      dockerfile: ../../docker/backend/Dockerfile
      additional_contexts:
        docker: ./docker/backend
    image: miller_backend
    container_name: miller_backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DJANGO_READ_DOT_ENV_FILE: 'False'
    volumes:
      - ./src/backend:/app
    ports:
      - '${BACKEND_PORT}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./src/frontend
      dockerfile: ../../docker/frontend/Dockerfile
    image: miller_frontend
    container_name: miller_frontend
    environment:
      VITE_DEFAULT_URL: ${VITE_DEFAULT_URL}
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '${FRONTEND_PORT}:3002'
    depends_on:
      - backend

  dumper:
    image: postgres:17-alpine
    container_name: miller_dumper
    env_file: .env
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Tashkent
    volumes:
      - ./backups:/backups
    configs:
      - source: dump_script
        target: /dump.sh
        mode: 0755
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          /dump.sh || echo "Dump failed"
          sleep "$${DUMP_INTERVAL_SECONDS:-86400}"
        done
    depends_on:
      postgres:
        condition: service_healthy

configs:
  pg_init:
    content: |
      CREATE EXTENSION IF NOT EXISTS pg_trgm;
  dump_script:
    content: |
      #!/bin/sh
      set -eu
      file="/backups/miller_$$(date +%Y-%m-%d_%H-%M).sql.gz"
      pg_dump --no-owner --no-privileges | gzip > "$$file"
      size=$$(stat -c %s "$$file")
      echo "Dump created: $$file ($$size bytes)"
      find /backups -name '*.sql.gz' -mtime +"$${DUMP_KEEP_DAYS:-7}" -delete
      if [ -z "$${DUMP_BOT_TOKEN:-}" ] || [ -z "$${DUMP_CHAT_ID:-}" ]; then
        echo "DUMP_BOT_TOKEN or DUMP_CHAT_ID not set, Telegram upload skipped"
        exit 0
      fi
      if [ "$$size" -gt 52428800 ]; then
        echo "Dump is over Telegram's 50 MB limit, upload skipped"
        exit 1
      fi
      command -v curl >/dev/null || apk add --no-cache curl >/dev/null
      curl -sS --fail --max-time 300 \
        -F chat_id="$$DUMP_CHAT_ID" \
        -F caption="$${DUMP_PROJECT_NAME:-Miller} | $$(date '+%d.%m.%Y %H:%M') | $$((size / 1024)) KB" \
        -F document=@"$$file" \
        "https://api.telegram.org/bot$$DUMP_BOT_TOKEN/sendDocument" > /dev/null
      echo "Dump sent to Telegram chat $$DUMP_CHAT_ID"

volumes:
  postgres_data: {}
  redis_data: {}
  frontend_node_modules: {}
